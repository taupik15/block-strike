
name: Build BLOCK STRIKE Offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-block-strike-apk.yml'

jobs:
  apk:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [[ ! -x "$SDK_MANAGER" ]]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "Using: $SDK_MANAGER"
          "$SDK_MANAGER" --version

          if [[ ! -f "$SDK_ROOT/platforms/android-35/android.jar" || ! -x "$SDK_ROOT/build-tools/35.0.0/aapt2" ]]; then
            for _ in {1..64}; do printf 'y\n'; done > "$RUNNER_TEMP/android-licenses.txt"
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
          echo "Android SDK 35 and build-tools 35.0.0 ready"

      - name: Stage game assets into APK
        run: python3 android/scripts/stage_game.py . android/app/src/main/assets/www

      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK created
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block-Strike-WEAPON1.1-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
