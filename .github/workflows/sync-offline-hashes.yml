name: sync-offline-hashes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "index.html"
      - "css/**"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh offline hashes
        run: node scripts/sync-offline-hashes.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- offline-assets.js sw.js; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add offline-assets.js sw.js
            git commit -m "chore: sync offline hashes [skip ci]"
            git push
          fi
