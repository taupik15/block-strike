plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockstrike.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blockstrike.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '11.10.20-weapon1.1-c4'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // All game assets are bundled. APK may exceed 200 MB; no expansion download.
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}
